name: release

# Publish macvscr to npm on a v* tag, using npm trusted publishing (OIDC).
#
# Split into two jobs so each does one thing:
#   1. build  — compiles the native arm64 binary on a macOS runner and uploads
#               it as an artifact.
#   2. publish — downloads the binary onto a minimal Linux runner and publishes
#               to npm via Trusted Publishing (OIDC). Keeping the publish job on
#               a plain `ubuntu-latest` runner isolates it from any build-runner
#               specifics and matches the most common OIDC setup.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26 # Apple Silicon runner with Xcode 26 + macOS 26 SDK (native arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Build (arm64)
        run: swift build -c release --arch arm64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: macvscr-binary
          path: .build/release/macvscr
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release # must match the trusted-publisher environment on npm
    permissions:
      id-token: write # required for npm trusted publishing / provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `registry-url` and no NODE_AUTH_TOKEN: Trusted Publishing
          # authenticates purely via the job's `id-token: write` permission
          # (OIDC). The default registry is already registry.npmjs.org.

      - name: Upgrade npm (Trusted Publishing needs npm ≥ 11.5.1)
        run: npm install -g npm@latest

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: macvscr-binary
          path: /tmp/macvscr-download/

      - name: Stage binary into the npm package
        run: |
          mkdir -p npm/binaries
          mv /tmp/macvscr-download/macvscr npm/binaries/macvscr-darwin-arm64
          chmod +x npm/binaries/macvscr-darwin-arm64
          ls -lh npm/binaries/

      - name: Verify package contents
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing + provenance)
        working-directory: npm
        run: npm publish --provenance --access public
