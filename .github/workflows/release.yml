name: release

# Publish macvscr to npm on a v* tag, using npm trusted publishing (OIDC).
#
# Split into two jobs so each does one thing:
#   1. build   — compiles the native arm64 binary on a macOS runner and uploads
#                it as an artifact.
#   2. publish — downloads the binary onto a minimal Linux runner and publishes
#                to npm via Trusted Publishing (OIDC). The publish job mirrors
#                a known-good trusted-publishing setup (setup-node@v6, node 24,
#                npm ^11.10.0, registry-url set, id-token: write).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Top-level OIDC permission, like the working reference project.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: macos-26 # Apple Silicon runner with Xcode 26 + macOS 26 SDK (native arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Build (arm64)
        run: swift build -c release --arch arm64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: macvscr-binary
          path: .build/release/macvscr
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release # must match the trusted-publisher environment on npm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm with trusted publishing support
        run: npm install -g "npm@^11.10.0"

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: macvscr-binary
          path: /tmp/macvscr-download/

      - name: Stage binary into the npm package
        run: |
          mkdir -p npm/binaries
          mv /tmp/macvscr-download/macvscr npm/binaries/macvscr-darwin-arm64
          chmod +x npm/binaries/macvscr-darwin-arm64
          ls -lh npm/binaries/

      - name: Verify package contents
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing + provenance)
        working-directory: npm
        run: npm publish --provenance --access public
