name: release

# Publish macvscr to npm on a v* tag, using npm trusted publishing (OIDC).
# The npm package must be configured to trust this repo/workflow (done once on npm).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-26 # Apple Silicon runner with Xcode 26 + macOS 26 SDK (native arm64)
    environment: npm-release # must match the trusted-publisher environment on npm
    permissions:
      id-token: write # required for npm trusted publishing / provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
        # NOTE: do NOT set NODE_AUTH_TOKEN. Trusted Publishing authenticates
        # purely via the job's `id-token: write` permission (OIDC); setting a
        # classic token makes npm skip the OIDC path and fail with a misleading
        # E404. `registry-url` is still needed so npm knows the target registry.

      - name: Upgrade npm (Trusted Publishing needs npm ≥ 11.5.1)
        run: npm install -g npm@latest

      - name: Build (arm64)
        run: swift build -c release --arch arm64

      - name: Stage binary into the npm package
        run: |
          mkdir -p npm/binaries
          cp .build/release/macvscr npm/binaries/macvscr-darwin-arm64
          chmod +x npm/binaries/macvscr-darwin-arm64
          ls -lh npm/binaries/

      - name: Verify package contents
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish to npm (trusted publishing + provenance)
        working-directory: npm
        run: npm publish --provenance --access public
